# macOS 云端打包：在 GitHub 的 Mac 服务器上把 LuckyWheel 打成 .app
# 触发方式：GitHub 仓库页面 Actions → Build macOS App → Run workflow（手动）
# 也可通过推送 v* 标签触发
name: Build macOS App

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14   # Apple Silicon（M1/M2/M3/M4）原生版
            arch: arm64
          - runner: macos-13   # Intel 芯片版
            arch: x86_64
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip pyinstaller pillow

      - name: Generate iconset and .icns
        run: |
          set -e
          SRC=icons/mac-icon-1024.png
          SET=icons/icon.iconset
          rm -rf "$SET"
          mkdir -p "$SET"
          sips -z 16 16     "$SRC" --out "$SET/icon_16x16.png"        >/dev/null
          sips -z 32 32     "$SRC" --out "$SET/icon_16x16@2x.png"     >/dev/null
          sips -z 32 32     "$SRC" --out "$SET/icon_32x32.png"        >/dev/null
          sips -z 64 64     "$SRC" --out "$SET/icon_32x32@2x.png"     >/dev/null
          sips -z 128 128   "$SRC" --out "$SET/icon_128x128.png"      >/dev/null
          sips -z 256 256   "$SRC" --out "$SET/icon_128x128@2x.png"   >/dev/null
          sips -z 256 256   "$SRC" --out "$SET/icon_256x256.png"      >/dev/null
          sips -z 512 512   "$SRC" --out "$SET/icon_256x256@2x.png"   >/dev/null
          sips -z 512 512   "$SRC" --out "$SET/icon_512x512.png"      >/dev/null
          cp "$SRC" "$SET/icon_512x512@2x.png"
          iconutil -c icns "$SET" -o icons/icon.icns
          echo "icns generated"

      - name: Build .app with PyInstaller
        run: |
          pyinstaller --noconfirm --windowed \
            --name LuckyWheel \
            --icon icons/icon.icns \
            wheel_app.py

      - name: Ad-hoc codesign
        # 免费账号只能 ad-hoc 签名；别人首次打开需右键→打开（或在隐私与安全性里允许）
        run: |
          codesign --force --deep --sign - dist/LuckyWheel.app
          codesign --verify dist/LuckyWheel.app && echo "signed OK"

      - name: Pack into zip
        run: ditto -c -k --keepParent dist/LuckyWheel.app LuckyWheel-mac-${{ matrix.arch }}.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LuckyWheel-mac-${{ matrix.arch }}
          path: LuckyWheel-mac-${{ matrix.arch }}.zip
          retention-days: 30
